<html lang="pt-BR">
<head>

<title>Gerador de Certificados | Grupo HOST</title>

/* Carregamento da fonte Kunstler Script */
@font-face {
  font-family: 'Kunstler Script';
  src: url('KUNSTLER.TTF') format('truetype'),
       local('Kunstler Script'),
       local('KunstlerScript');
  font-weight: normal;
  font-style: normal;
}

:root {
  --ink: #111111;
  --line: #e2ded7;
  --panel-bg: #ffffff;
  --btn-primary: #2d241e;
  --btn-secondary: #eee9e3;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: #edeae5;
  color: #2b2520;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  gap: 24px;
  padding: 24px;
  max-width: 1650px;
  margin: auto;
}

/* Painel de Controle */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  height: max-content;
  box-shadow: 0 8px 30px rgba(0,0,0,0.05);
}

h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; }
.sub { font-size: 12px; color: #736c64; margin: 0 0 18px; line-height: 1.4; }

label, .legend {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 6px;
  color: #453c35;
}

.field { margin: 0 0 15px; }
input[type="text"], input[type="date"], select, textarea {
  width: 100%;
  border: 1px solid #dcd5cc;
  border-radius: 7px;
  padding: 9px 11px;
  font: 13px Arial, sans-serif;
  color: #1a1a1a;
  background: #faf9f7;
  transition: border-color .2s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #594535;
  background: #fff;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.42; }

.checks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfaf8;
}
.checks label {
  font-size: 11.5px;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  display: flex;
  gap: 6px;
  align-items: flex-start;
  margin: 0;
  cursor: pointer;
  color: #2f2721;
}
.checks input { margin-top: 2px; accent-color: #634325; }

.actions { display: grid; gap: 9px; margin-top: 18px; }
button {
  border: 0;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s, transform .1s, background-color .2s;
}
button:active { transform: scale(0.99); }
.primary { background: var(--btn-primary); color: white; }
.secondary { background: var(--btn-secondary); color: #32261e; }
.outline { background: white; border: 1px solid #d4ccc2; color: #32261e; }
.danger { background: white; border: 1px solid #d93025; color: #d93025; }
.danger:hover { background: #fce8e6; }

.certificate-list { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.cert-tab {
  background: #ede8e1;
  color: #55493e;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
}
.cert-tab.active { background: #2d241e; color: white; }
